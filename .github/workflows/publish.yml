name: Publish next video

on:
  schedule:
    # Runs Mondays and Thursdays at 15:00 UTC — adjust to taste.
    - cron: "0 15 * * 1,4"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp_creds.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_creds.json
          python run_pipeline.py

      - name: Commit updated queue/history
        run: |
          git config user.name "video-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/topics_queue.yaml state/history.json
          git diff --cached --quiet || git commit -m "Publish run $(date -u +%Y-%m-%d)"
          git push
