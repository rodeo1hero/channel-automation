# Everything that defines the channel's voice/format lives here so the pipeline
# stays generic Python code and all the "creative direction" is editable without touching it.

channel_name: "Rodion's video essays"   # TODO: replace with actual channel name
niche: >
  Short pop-science / psychological video essays. Format: take an everyday thing
  or assumption and reveal the hidden mechanism, history, or system behind it.
tone: "Curious, clear, a little irreverent. Explain like a smart friend, not a textbook."
# Spoken-narration length BEFORE the 1.2x final speed-up in pipeline/assemble.py
# (SPEED_FACTOR) -- the actual published video runs shorter than this by that
# factor (e.g. 12 here -> ~10 min final video). Set this to your target final
# length x 1.2, not the final length itself.
target_length_minutes: 12
language: "en"

# TTS voice (Google Cloud TTS voice name — change to taste, list via
# `gcloud texttospeech voices list` or the Cloud console)
tts:
  provider: "google"
  voice_name: "en-US-Chirp3-HD-Charon"
  speaking_rate: 1.0

# Visuals: a recurring stick-figure character -- same face and build every
# time, wearing one of a handful of outfits (see pipeline/character_gen.py's
# OUTFITS) -- is composited over an AI-generated background per scene
# (pipeline/scene_backgrounds.py, Replicate/FLUX). Claude picks the outfit
# and each scene's actions/background description when writing the script
# (see pipeline/script_writer.py); there's nothing to configure here. Pose
# sprites are generated on demand and cached per (outfit, pose) combination
# under assets/character/<outfit>/, so cost only recurs for genuinely new
# combinations, not every video.

youtube:
  category_id: "27"     # Education
  privacy_status: "private"   # "private" (review before publishing) | "public" | "unlisted"
  default_tags: ["video essay", "history", "psychology", "explained"]
