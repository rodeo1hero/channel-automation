- title: How Caesar Became So Powerful
  angle: 'Follow Julius Caesar''s rise from politician to dictator, framed almost
    like a modern political/business analyst breaking down a power play: "Caesar had
    a problem. He needed money, popularity, and an army. Ideally, all three." Then
    show how he built each one in turn. Caesar himself can recur as the authority
    archetype across multiple scenes (the same crown/cloak design gets reused consistently
    within one video, so it reads as one consistent character). Other cast interactions
    (archetype in parentheses): a rival politician (official), a soldier under his
    command (guard), a wealthy backer (wealthy), an ordinary citizen swayed by his
    popularity (poor). Themes: politics, wealth, influence, ambition, power.'
- title: Why Rome Was Rich but Ordinary Romans Were Poor
  angle: 'Explain the gap between the Roman elite and ordinary people through a handful
    of quick vignettes rather than one long explanation. Cast interactions (archetype
    in parentheses): a wealthy Roman showing off his villa/wealth (wealthy), a poor
    Roman struggling to afford basics (poor), a merchant raising prices (merchant),
    a tax collector demanding payment (official). Feel free to make this genuinely
    funny -- for example a short haggling exchange like: Poor Roman: "How much is
    bread?" Merchant: "One coin." Poor Roman: "I only have half a coin." Merchant:
    "Then I have half a bread." Narrator: "Capitalism had entered the chat." Themes:
    inequality, wealth, taxation, inflation, and class.'
